<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>了解我的程度测试</title>

<style>

body{
font-family:"Microsoft YaHei",sans-serif;
background:#f5f7fb;
margin:0;
padding:20px;
}

.container{
max-width:700px;
margin:auto;
background:white;
padding:25px;
border-radius:20px;
box-shadow:0 5px 20px #ddd;
}

h1{
text-align:center;
}

.question{
margin-top:25px;
padding:15px;
background:#fafafa;
border-radius:15px;
}

label{
display:block;
padding:10px;
margin:8px;
background:#eee;
border-radius:10px;
cursor:pointer;
}

label:hover{
background:#dff7e3;
}

button{

width:100%;
padding:15px;
margin-top:25px;
border:0;
border-radius:15px;
background:#4caf50;
color:white;
font-size:18px;

}

#result{

margin-top:20px;
padding:15px;
background:#f0fff0;
border-radius:15px;

}

</style>

</head>


<body>


<div class="container">

<h1>你了解我吗？</h1>

<p>完成测试，看看你对我的了解程度</p>


<div id="quiz"></div>


<button onclick="submitTest()">
提交测试
</button>


<div id="result"></div>


</div>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>


<script>


// ====== Supabase配置 ======

const supabaseUrl="https://grgpdzyrexzywvkzbpcc.supabase.co";

const supabaseKey="sb_publishable_tJ6SRnaL6yc9CDcq-LOYoA_HDvrwc5v";


const db=supabase.createClient(
supabaseUrl,
supabaseKey
);


// =====题库=====


const questions=[


{
q:"我喜欢二次元吗？",
options:["喜欢","不喜欢"],
answer:1
},


{
q:"我喜欢哪位歌手？",
options:["洛天依","初音未来"],
answer:0
},


{
q:"我喜欢用什么AI？",
options:["GPT / Claude","DeepSeek / 豆包"],
answer:0
},


{
q:"我最喜欢哪个平台？",
options:["抖音 / 快手","哔哩哔哩 / X"],
answer:1
},


{
q:"手机打字我只用？",
options:["26键","9键"],
answer:1
},


{
q:"我的性取向？",
options:["直男","gay"],
answer:0
},


{
q:"我更喜欢哪个社交软件？",
options:["微信","QQ"],
answer:1
},


{
q:"我喜欢玩什么游戏？",
options:[
"王者荣耀",
"无畏契约",
"不玩游戏",
"三角洲"
],
answer:2
},


{
q:"我更关注？",
options:[
"游戏更新/新游戏发布",
"时政/新的模型发布",
"新梗"
],
answer:1
},


{
q:"我的性格（玩熟后）？",
options:[
"高冷",
"抽象",
"高冷 / 抽象（看情况）"
],
answer:2
}


];


let html="";


questions.forEach((item,index)=>{


html+=`

<div class="question">

<b>${index+1}.${item.q}</b>

${item.options.map((o,i)=>`

<label>

<input type="radio" name="q${index}" value="${i}">

${o}

</label>

`).join("")}

</div>


`;

});


document.getElementById("quiz").innerHTML=html;



async function submitTest(){


let score=0;

let correct=[];

let wrong=[];



questions.forEach((q,i)=>{


let choose=document.querySelector(
`input[name=q${i}]:checked`
);


if(choose){

if(Number(choose.value)==q.answer){

score++;

correct.push(i+1);

}else{

wrong.push(i+1);

}

}


});



let name=prompt("请输入你的名字");


await db
.from("test_results")
.insert({

name:name||"匿名",

score:score*10,

correct:correct,

wrong:wrong,

duration:0

});



document.getElementById("result").innerHTML=

`
<h2>测试完成</h2>

<p>得分：${score}/10</p>

<p>答对题目：${correct.join(",")||"无"}</p>

<p>答错题目：${wrong.join(",")||"无"}</p>

`;



}


</script>


</body>

</html>
